<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contour Line Waves</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; /* 白底 */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="waveCanvas"></canvas>

<!-- 引入 Simplex Noise 函式庫來產生自然的等高線波動 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
<script>
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let simplex = new SimplexNoise();
    let time = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        // 支援 Retina 顯示器，讓極細的線條更清晰
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    
    window.addEventListener('resize', resize);
    resize();

    function draw() {
        ctx.clearRect(0, 0, width, height);
        
        // 為了精確控制各色線條數量，我們改用陣列手動定義每條線的屬性
        // type: 'accent' (青藍色), 'sub' (深灰色), 'light' (淺灰色)
        // group: 'top' (上半部), 'bottom' (下半部)
        // yOffsetRel: 在該區域內的相對位置 (0.0 ~ 1.0)
        const linesConfig = [
            // === 上半部 (共 5 條：2青、1深灰、2淺灰) ===
            { type: 'accent', group: 'top', yOffsetRel: 0.00 },
            { type: 'light',  group: 'top', yOffsetRel: 0.25 },
            { type: 'sub',    group: 'top', yOffsetRel: 0.50 },
            { type: 'light',  group: 'top', yOffsetRel: 0.75 },
            { type: 'accent', group: 'top', yOffsetRel: 1.00 },

            // === 下半部 (共 4 條：1青、1深灰、2淺灰) ===
            { type: 'light',  group: 'bottom', yOffsetRel: 0.00 },
            { type: 'sub',    group: 'bottom', yOffsetRel: 0.33 },
            { type: 'light',  group: 'bottom', yOffsetRel: 0.66 },
            { type: 'accent', group: 'bottom', yOffsetRel: 1.00 }
        ];

        const stepX = 5; // X軸取樣間距
        
        // 為了讓波浪有呼吸感，隨時間緩慢推進
        time += 0.0015;

        for (let i = 0; i < linesConfig.length; i++) {
            let config = linesConfig[i];
            ctx.beginPath();
            
            // 決定線條的粗細與顏色
            if (config.type === 'accent') {
                ctx.strokeStyle = 'rgba(0, 153, 161, 0.4)'; // 青藍色，統一 40% 透明度
                ctx.lineWidth = 1.2;
            } else if (config.type === 'sub') {
                ctx.strokeStyle = 'rgba(100, 100, 100, 0.4)'; // 深灰色，統一 40% 透明度
                ctx.lineWidth = 0.8;
            } else {
                ctx.strokeStyle = 'rgba(200, 200, 200, 0.4)'; // 淺灰色，統一 40% 透明度
                ctx.lineWidth = 0.5;
            }

            // 分配起始 Y 座標：縮小佔用高度讓線條更緊密
            let baseY;
            if (config.group === 'top') {
                // 上半部佔畫面的 0% ~ 12%
                baseY = (height * 0.12) * config.yOffsetRel;
            } else {
                // 下半部佔畫面的 88% ~ 100%
                baseY = (height * 0.88) + (height * 0.12) * config.yOffsetRel;
            }
            
            for (let x = 0; x <= width; x += stepX) {
                // 利用 2D Noise 產生平滑的高低起伏
                // 參數：X位置、Y位置(固定為i)、時間
                // 增加 Y 軸的亂數取樣間距 (從 0.05 改為 0.3)，讓相鄰線條的變異更大，產生交錯效果
                let noiseValue = simplex.noise3D(x * 0.002, i * 0.3, time);
                
                // 讓畫面中間的波動特別大，邊緣較平緩
                let distanceToCenter = Math.abs(x - width / 2) / (width / 2);
                let edgeDamping = 1 - Math.pow(distanceToCenter, 2);
                
                // Y 軸偏移量：大幅縮小波浪的上下起伏高度，避免佔據太多空間
                let offsetY = noiseValue * 50 * edgeDamping;
                
                let y = baseY + offsetY;
                
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }
        
        requestAnimationFrame(draw);
    }
    
    draw();
</script>

</body>
</html>
