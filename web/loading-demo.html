<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Loading 動畫效果預覽</title>
<style>
  body { 
    background: #f4f6f8; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif; 
    gap: 80px; 
  }
  .demo-container { 
    text-align: center; 
    background: #fff;
    padding: 40px 60px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    min-width: 300px;
  }
  .demo-title { 
    color: #4a5568; 
    margin-bottom: 24px; 
    font-size: 1.1rem; 
    font-weight: 600;
  }
  
  /* 用 SVG 簡單模擬您的海浪圖騰 */
  .wave-icon { 
    width: 44px; 
    height: 22px; 
    fill: #27a2a8; /* 接近您圖片的海浪藍綠色 */
    margin: 0 -2px; /* 讓海浪之間稍微靠攏，符合您的圖片 */
  }

  /* ============================
     效果 2: 呼吸起伏 (Pulse)
     ============================ */
  .loading-style-2 { 
    display: flex; 
    justify-content: center; 
    align-items: center;
    height: 40px;
  }
  .loading-style-2 svg {
    opacity: 0.2;
    transform: scale(0.7);
    animation: wavePulse 1.4s infinite ease-in-out;
  }
  /* 設定三個海浪的時間差，產生波浪感 */
  .loading-style-2 svg:nth-child(1) { animation-delay: 0s; }
  .loading-style-2 svg:nth-child(2) { animation-delay: 0.2s; }
  .loading-style-2 svg:nth-child(3) { animation-delay: 0.4s; }

  @keyframes wavePulse {
    0%, 100% { opacity: 0.2; transform: scale(0.7); }
    40% { opacity: 1; transform: scale(1); }
  }


  /* ============================
     效果 3: 無縫延伸 (平滑版)
     ============================ */
  .loading-style-3-smooth { 
    display: flex; 
    justify-content: center; 
    height: 40px;
    align-items: center;
  }
  .mask-container-smooth {
    display: flex;
    /* 利用 clip-path 遮罩由左至右打開 */
    clip-path: inset(0 100% 0 0);
    animation: waveRevealSmooth 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
  }
  .mask-container-smooth svg { 
    opacity: 1; 
  }

  @keyframes waveRevealSmooth {
    0% { clip-path: inset(0 100% 0 0); }
    40% { clip-path: inset(0 0 0 0); } /* 展開至 100% */
    60% { clip-path: inset(0 0 0 0); } /* 停留一下 */
    100% { clip-path: inset(0 0 0 100%); } /* 從左邊縮回去，像退潮一樣 */
  }


  /* ============================
     效果 3: 無縫延伸 (分段跳躍版 - 最像您的分鏡圖)
     ============================ */
  .loading-style-3-steps { 
    display: flex; 
    justify-content: center; 
    height: 40px;
    align-items: center;
  }
  .mask-container-steps {
    display: flex;
    clip-path: inset(0 100% 0 0);
    /* 使用 steps 分段，產生一格一格跳出來的感覺 */
    animation: waveRevealSteps 1.5s infinite steps(3, end);
  }

  @keyframes waveRevealSteps {
    0% { clip-path: inset(0 100% 0 0); } /* 0 個海浪 */
    100% { clip-path: inset(0 0 0 0); }  /* 3 個海浪 */
  }
  /* 為了讓第三個海浪有停留時間，外層再包一個淡出循環 */
  .steps-wrapper {
    animation: fadeLoop 1.5s infinite;
  }
  @keyframes fadeLoop {
    0%, 80% { opacity: 1; }
    100% { opacity: 0; }
  }

</style>
</head>
<body>

  <div class="demo-container">
    <div class="demo-title">效果 2：呼吸起伏（優雅微光）</div>
    <div class="loading-style-2">
      <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
      <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
      <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
    </div>
    <p style="font-size:0.9rem; color:#888; margin-top:20px;">每個海浪輪流變亮並微微放大，節奏像真實海浪。</p>
  </div>

  <div class="demo-container">
    <div class="demo-title">效果 3：無縫延伸（平滑漲退潮）</div>
    <div class="loading-style-3-smooth">
      <div class="mask-container-smooth">
        <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
        <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
        <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
      </div>
    </div>
    <p style="font-size:0.9rem; color:#888; margin-top:20px;">像水流一樣從左滑動出來，然後再往右退潮縮回去。</p>
  </div>
  
  <div class="demo-container">
    <div class="demo-title">效果 3：無縫延伸（分段跳躍版 - 最接近原意）</div>
    <div class="loading-style-3-steps">
      <div class="steps-wrapper">
        <div class="mask-container-steps">
          <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
          <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
          <svg class="wave-icon" viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
        </div>
      </div>
    </div>
    <p style="font-size:0.9rem; color:#888; margin-top:20px;">1個變2個變3個，有明確的「增加」段落感。</p>
  </div>

</body>
</html>
