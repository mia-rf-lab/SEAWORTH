<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>下拉選單設計提案預覽</title>
<style>
  :root {
    --ci-boundless-blue: #008B9C;
    --ci-abundant-blue: #00495B;
    --white: #FFFFFF;
    --bg-dark: #071724; /* 模擬暗色海洋背景 */
    --font-cn: 'Noto Sans TC', 'PingFang TC', sans-serif;
  }
  body { 
    background: var(--bg-dark); 
    color: var(--white);
    font-family: var(--font-cn);
    margin: 0; padding: 50px 0 100px;
    display: flex; flex-direction: column; gap: 60px;
    align-items: center;
  }
  .demo-section {
    width: 100%; max-width: 900px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 40px 60px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .demo-title { 
    margin-bottom: 50px; font-size: 1.15rem; color: #8bcbd3; 
    font-weight: 300; letter-spacing: 0.1em; 
    border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
  }
  
  /* Reset lists */
  ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 50px; }
  a { text-decoration: none; color: inherit; display: block; }
  
  /* =================================================
     Style A: 現代科技感（毛玻璃與光影）
     ================================================= */
  .nav-A { position: relative; }
  .nav-A > li { position: relative; padding: 15px 0; cursor: pointer; }
  .nav-A > li > a { font-size: 1rem; color: rgba(255,255,255,0.85); transition: color 0.3s; }
  
  /* Hover 底線 (中間滑開) */
  .nav-A > li::after {
    content: ""; position: absolute; bottom: 5px; left: 50%;
    width: 0; height: 1.5px; background: var(--ci-boundless-blue);
    transition: all 0.3s ease; transform: translateX(-50%);
    box-shadow: 0 0 5px var(--ci-boundless-blue);
  }
  .nav-A > li:hover > a { color: #fff; }
  .nav-A > li:hover::after { width: 100%; }
  
  /* Dropdown A (Glassmorphism) */
  .dropdown-A {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(15px);
    background: rgba(0, 20, 35, 0.6);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 12px 0; min-width: 170px;
    opacity: 0; visibility: hidden;
    transition: all 0.3s ease;
    display: flex; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .nav-A > li:hover .dropdown-A { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-A a {
    padding: 12px 28px; color: rgba(255,255,255,0.7); font-size: 0.9rem;
    transition: all 0.3s ease; text-align: left;
  }
  .dropdown-A a:hover {
    color: #fff;
    background: rgba(255,255,255,0.06);
    transform: translateX(4px);
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
  }

  /* =================================================
     Style B: 國際頂級企業感（極簡俐落邊線）
     ================================================= */
  .nav-B { position: relative; }
  /* 實作群組 Hover 讓其他人變暗 */
  .nav-B:hover > li > a { color: rgba(255,255,255,0.3); }
  .nav-B > li { position: relative; padding: 15px 0; cursor: pointer; }
  .nav-B > li > a { font-size: 1rem; color: rgba(255,255,255,0.9); transition: color 0.3s; }
  .nav-B > li:hover > a { color: #fff; }

  /* Dropdown B (Minimalist White) */
  .dropdown-B {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(10px);
    background: #fff;
    border-radius: 0; /* 銳利直角 */
    padding: 20px 0; min-width: 190px;
    opacity: 0; visibility: hidden;
    transition: all 0.2s ease;
    display: flex; flex-direction: column; gap: 4px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  }
  .nav-B > li:hover .dropdown-B { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-B a {
    position: relative;
    padding: 10px 32px; color: #444; font-size: 0.85rem; letter-spacing: 0.08em;
    transition: color 0.3s; text-align: left;
  }
  /* 左側藍線 */
  .dropdown-B a::before {
    content: ""; position: absolute; left: 0; top: 15%; height: 70%; width: 3px;
    background: var(--ci-boundless-blue);
    transform: scaleY(0); transform-origin: center; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .dropdown-B a:hover { color: var(--ci-boundless-blue); }
  .dropdown-B a:hover::before { transform: scaleY(1); }


  /* =================================================
     Style C: 海洋律動感（微小波浪推移）
     ================================================= */
  .nav-C { position: relative; }
  .nav-C > li { position: relative; padding: 15px 0; cursor: pointer; }
  .nav-C > li > a { font-size: 1rem; color: rgba(255,255,255,0.9); transition: color 0.3s; }
  .nav-C > li:hover > a { color: var(--ci-boundless-blue); }
  
  /* Hover 波浪指示器 */
  .nav-C > li .wave-indicator {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) translateY(5px);
    opacity: 0; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .nav-C > li .wave-indicator svg { width: 22px; height: 11px; fill: var(--ci-boundless-blue); }
  .nav-C > li:hover .wave-indicator { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Dropdown C (Wide Float) */
  .dropdown-C {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(15px);
    background: #fff;
    border-radius: 4px;
    padding: 24px 0; min-width: 210px; /* 更大的留白 */
    opacity: 0; visibility: hidden;
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .nav-C > li:hover .dropdown-C { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dropdown-C a {
    padding: 8px 36px; color: #555; font-size: 0.9rem; letter-spacing: 0.1em;
    transition: all 0.3s ease; text-align: left;
  }
  .dropdown-C a:hover {
    color: var(--ci-abundant-blue);
    transform: translateX(8px); /* 輕盈右推 */
  }
</style>
</head>
<body>

  <div class="demo-section">
    <div class="demo-title">提案 A：現代科技感（毛玻璃與光影）🌟推薦</div>
    <ul class="nav-A">
      <li><a href="#">共善經營</a></li>
      <li>
        <a href="#">投資人專區</a>
        <div class="dropdown-A">
          <a href="#">投資亮點</a>
          <a href="#">策略布局</a>
          <a href="#">股東訊息</a>
        </div>
      </li>
      <li><a href="#">最新消息</a></li>
    </ul>
  </div>

  <div class="demo-section">
    <div class="demo-title">提案 B：國際頂級企業感（極簡俐落邊線）</div>
    <ul class="nav-B">
      <li><a href="#">共善經營</a></li>
      <li>
        <a href="#">投資人專區</a>
        <div class="dropdown-B">
          <a href="#">投資亮點</a>
          <a href="#">策略布局</a>
          <a href="#">股東訊息</a>
        </div>
      </li>
      <li><a href="#">最新消息</a></li>
    </ul>
  </div>

  <div class="demo-section">
    <div class="demo-title">提案 C：海洋律動感（波浪指示與輕盈推移）</div>
    <ul class="nav-C">
      <li><a href="#">共善經營</a></li>
      <li>
        <a href="#">投資人專區</a>
        <!-- 波浪圖騰 -->
        <div class="wave-indicator">
          <svg viewBox="0 0 100 50"><path d="M50,0 Q75,30 100,30 Q50,50 0,30 Q25,30 50,0 Z" /></svg>
        </div>
        <div class="dropdown-C">
          <a href="#">投資亮點</a>
          <a href="#">策略布局</a>
          <a href="#">股東訊息</a>
        </div>
      </li>
      <li><a href="#">最新消息</a></li>
    </ul>
  </div>

</body>
</html>
